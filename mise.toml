# Auxiliary project-local tooling for Agent Skills.
# Unity/Editor/C# remain the application toolchain.

[tools]
bun = "1.4.2"
uv = "0.13.7"
# `script/compile-check.sh` が使う C# コンパイラ。Unity 本体のツールチェーンではなく
# 「Unity を起動せずに型エラーを見る」ための補助。無いと shim が
# "No version is set for shim: dotnet" で落ちる (2026-11-10 追加)。
dotnet = "8.0.427"
# Cloud / festival API toolchain (Issue #9 preflight).
# Project-local only: never install these globally. Run them via
# `mise exec -- cf ...` / `mise exec -- void ...` so every host (macOS,
# Windows) resolves the same pinned versions.
"npm:cf" = "1.0.0-beta.28"
"npm:void" = "1.6.2"

[tasks.skills-list]
run = "bunx skills add rebuildup/project-init --list"

[tasks.skills-bootstrap]
run = "bunx skills add rebuildup/project-init --skill '*' --agent claude-code --agent codex -y"

[tasks.skills-update]
run = "bunx skills update -p -y"

# Verify that every vendored Skill still matches skills-lock.json.
# Offline (no network) and is the gate referenced by
# docs/adr/ADR-0001-agent-environment.md and specs/056-agent-env/spec.md.
[tasks."skills-check"]
run = "bun evals/policy-evaluation/vendored-skills-contract.mts"

# Build the v6 review evidence manifest (Issue #388) and check its tests.
# `evidence-manifest` writes docs/evidence/.../manifest.json from the
# hand-written claims; `evidence-manifest-test` runs the unit fixtures
# (including the missing/wrong-OS/stale/design-mismatch negative cases).
[tasks."evidence-manifest"]
run = "bun evals/evidence-manifest/manifest.mts docs/evidence/368-review-2026-11-12/manifest-input.json --root . --out docs/evidence/368-review-2026-11-12/manifest.json"

[tasks."evidence-manifest-test"]
run = "bun test evals/evidence-manifest/"

# Render the reviewer-facing report (Issue #389) from the manifest plus the
# reviewer notes. The CLI exits 1 while anything is unverified or a human
# decision is open, so CI cannot mistake it for green; the task itself tolerates
# that expected 1 and only fails on a real error.
[tasks."evidence-report"]
run = """
bun evals/evidence-manifest/report.mts docs/evidence/368-review-2026-11-12/manifest.json --notes docs/evidence/368-review-2026-11-12/review-notes.json --out docs/ui/v6-review-report-2026-11-12.md || test $? -eq 1
"""

# One lifecycle for Worktrunk, plain git and IDE-created worktrees.
# See scripts/worktree/setup.sh and docs/adr/ADR-0001-agent-environment.md.
[tasks."worktree:setup"]
run = "bash scripts/worktree/setup.sh"

[tasks."worktree:teardown"]
run = "bash scripts/worktree/teardown.sh"

# Spec Kit CLI (github/spec-kit). Pinned version, installed into the
# project-local .tools/ directory so Mac and Windows workers materialize the
# same CLI. See docs/agent/spec-kit-workflow.md.
[tasks.specify-install]
run = "uv tool install --force specify-cli==1.3.1"

[tasks.specify-init]
run = """
uvx --from specify-cli==1.3.1 specify init --here --force --non-interactive --integration claude --script sh
uvx --from specify-cli==1.3.1 specify integration install codex --script sh
uvx --from specify-cli==1.3.1 specify integration install omp --script sh
"""
