# Auxiliary project-local tooling for Agent Skills.
# Unity/Editor/C# remain the application toolchain.

[tools]
bun = "1.4.2"
# Cloud / festival API toolchain (Issue #9 preflight).
# Pinned so the Mac and Windows agents resolve identical CLIs.
"npm:wrangler" = "4.158.0"
"npm:void" = "1.6.2"

[tasks.skills-list]
run = "bunx skills add rebuildup/project-init --list"

[tasks.skills-bootstrap]
run = "bunx skills add rebuildup/project-init --skill '*' --agent claude-code --agent codex -y"

[tasks.skills-update]
run = "bunx skills update -p -y"
