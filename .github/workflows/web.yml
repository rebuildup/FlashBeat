name: web

# Web Studio (`web/`) の品質ゲート: typecheck → unit tests → production build。
#
# - Playwright は実行しない (ブラウザのインストールが重く、E2E は dev server 前提
#   のため)。spec はローカルで `npm run test:studio` で実行する。
# - シークレットは不要。本番や外部サービスへの通信は行わない。

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 開発環境 (Node v26) に合わせる。
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
