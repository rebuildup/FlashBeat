name: build-win64

# 展示中も Unity 本体のビルドを展示 PC 以外で行い、展示ビルドの ZIP と
# SHA-256 を GitHub Releases の材料として出すための経路 (issue #41 / P3)。
#
# 前提:
#   - リポジトリは public なので GitHub-hosted (windows-latest) ランナーは無料。
#   - Unity のライセンスは secret 経由で渡す。以下のどちらか:
#       (A) UNITY_LICENSE : .ulf ライセンスファイル (中身の XML, または base64)
#           Unity 的人工ライセンス (Personal) 用。UNITY_EMAIL / UNITY_PASSWORD は任意。
#       (B) UNITY_EMAIL / UNITY_PASSWORD ( + 有償ライセンスなら UNITY_SERIAL )
#           Unity アカウントでのライセンス認証用。
#   - ライセンス未設定は blocker として失敗する。緑は成果物生成成功だけを表す。
#   - 展示 Windows PC は CI の self-hosted runner として使わない (展示と干渉するため)。

on:
  workflow_dispatch:
    inputs:
      version_base:
        description: "PlayerSettings.bundleVersion の基準バージョン (例: 0.1.1)"
        required: false
        default: ""
      update_channel:
        description: "更新チャンネル (stable | preview)。手動実行は preview を推奨"
        required: false
        default: "preview"
      run_tests:
        description: "EditMode テストを先に実行するか (true | false)"
        required: false
        default: "true"
  push:
    branches:
      - main
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/build-win64.yml"

concurrency:
  group: build-win64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ライセンス未設定を数分で検出するため、Unity を導入する前に落とす。
  license-precheck:
    name: ライセンス設定の確認
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 必要な secret があるか確認
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          has_ulf=0; has_account=0
          [ -n "${UNITY_LICENSE:-}" ] && has_ulf=1
          { [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; } && has_account=1
          if [ "$has_ulf" = 1 ] || [ "$has_account" = 1 ]; then
            echo "Unity ライセンス認証情報が設定されています。"
            exit 0
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Win64 ビルド blocked: Unity ライセンス未設定

          Win64 成果物 (ZIP / SHA-256) は生成されていません。リポジトリの
          **Settings → Secrets and variables → Actions** に次の secret を登録してください。

          | secret | 必須 | 内容 |
          |---|---|---|
          | `UNITY_LICENSE` | いずれか1つ | Unity Hub で発行した `.ulf` ライセンスファイルの**内容**(XML)。base64 でも可。 |
          | `UNITY_EMAIL` | いずれか1つ | Unity アカウントのメールアドレス。 |
          | `UNITY_PASSWORD` | いずれか1つ | Unity アカウントのパスワード。 |
          | `UNITY_SERIAL` | 有償ライセンスのみ | `XX-XXXX-XXXX-XXXX-XXXX-XXXX` 形式。 |

          - Personal ライセンス: `UNITY_LICENSE` (.ulf) を推奨。Unity Hub の
            「Get a free personal license」で `Unity_lic.ulf` を発行し、その内容を登録する。
          - Plus / Pro ライセンス: `UNITY_SERIAL` + `UNITY_EMAIL` + `UNITY_PASSWORD` を登録する。
          - いずれの.secret も値をログ・Issue・PR に出さないこと。
          SUMMARY
          echo "::error title=Unity license required::UNITY_LICENSE または UNITY_EMAIL/UNITY_PASSWORD を Actions Secrets に登録してください。"
          exit 1

  build:
    name: Win64 ビルド
    needs: license-precheck
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      UNITY_VERSION: 6000.5.6f1
    steps:
      - name: ソースを取得 (LFS 込み)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity Editor をインストール (Hub 不使用)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hub を経由せず、エディタ本体のインストーラを直接入れる。
          # revision は Unity リリース API で確認済みの 6000.5.6f1 のもの。
          $rev = '0e0577a1a2ac'
          $exe = "$env:RUNNER_TEMP\UnitySetup64-$($env:UNITY_VERSION).exe"
          $url = "https://download.unity3d.com/download_unity/$rev/Windows64EditorInstaller/UnitySetup64-$($env:UNITY_VERSION).exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          # ダウンロードした実行ファイルは Mark-of-the-Web でブロックされることがあるため解除する。
          Unblock-File -Path $exe
          # /D= は引用符なし・空白を含まないパスのみ有効。ランナーの D: (一時 disk) は
          # 空きが大きく、Program Files と違って昇格 (UAC) 不要で書き込める。
          $dest = 'D:\Unity\Editor\6000.5.6f1'
          $proc = Start-Process -FilePath $exe -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Unity Editor インストーラが exit $($proc.ExitCode) で失敗しました" }
          $unityExe = "$dest\Editor\Unity.exe"
          if (-not (Test-Path $unityExe)) { throw "Unity Editor をインストールできませんでした ($unityExe が見つかりません)" }
          "UNITY_EDITOR=$unityExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UNITY_EDITOR_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "installed: $unityExe"

      # game-ci/unity-activate は Docker 前提のため GitHub-hosted Windows ランナーでは
      # そのまま使えない。Unity の公式ライセンス引数 (-manualLicenseFile / -username) を
      # 直接使って認証する。
      - name: Unity ライセンスを適用
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $log = "$env:RUNNER_TEMP\activate.log"
          $lic = "$env:ProgramData\Unity\Unity_lic.ulf"
          # Unity が起動早期に Caches ディレクトリを作ろうとして失敗するケースへの対策:
          # 必要なディレクトリを作成しておき、作業ディレクトリも明示しておく。
          # (実測: CreateDirectory 'C:/Users/runneradmin/AppData/Local/Unity/Caches' failed
          #  で Unity が落ち、$LASTEXITCODE も空になりジョブが失敗した)
          foreach ($dir in @(
            "$env:LOCALAPPDATA\Unity",
            "$env:LOCALAPPDATA\Unity\Caches",
            "$env:APPDATA\Unity",
            "$env:ProgramData\Unity"
          )) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }
          Push-Location $env:GITHUB_WORKSPACE
          try {
            $hasUlf = -not [string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)
            $hasAccount = (-not [string]::IsNullOrWhiteSpace($env:UNITY_EMAIL)) -and (-not [string]::IsNullOrWhiteSpace($env:UNITY_PASSWORD))
            if ($hasUlf) {
              # secret は「.ulf の XML そのもの」か「base64」のどちらでも受ける。
              $raw = $env:UNITY_LICENSE
              $content = $null
              if ($raw.TrimStart().StartsWith("<")) {
                $content = $raw
              } else {
                try { $content = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($raw)) }
                catch { throw "UNITY_LICENSE が XML でも base64 でもありません (secret の内容を確認してください)" }
              }
              if (-not $content.TrimStart().StartsWith("<")) { throw "UNITY_LICENSE の内容が .ulf XML ではありません" }
              $ulf = "$env:RUNNER_TEMP\Unity_lic.ulf"
              [IO.File]::WriteAllText($ulf, $content, (New-Object Text.UTF8Encoding($false)))
              & $env:UNITY_EDITOR -batchmode -quit -nographics -manualLicenseFile $ulf -logFile $log
              $code = $LASTEXITCODE
            } elseif ($hasAccount) {
              $activateArgs = @("-batchmode", "-quit", "-nographics", "-username", $env:UNITY_EMAIL, "-password", $env:UNITY_PASSWORD)
              if (-not [string]::IsNullOrWhiteSpace($env:UNITY_SERIAL)) { $activateArgs += @("-serial", $env:UNITY_SERIAL) }
              & $env:UNITY_EDITOR @activateArgs -logFile $log
              $code = $LASTEXITCODE
            } else {
              throw "Unity ライセンス認証情報がありません"
            }
          } finally {
            Pop-Location
          }
          if (Test-Path $log) { Get-Content $log -Tail 60 }
          # $LASTEXITCODE が空のままのことがある (Unity が早期クラッシュした場合など)。
          # その場合は exit コードではなくライセンス実ファイルの有無で判定する。
          $activated = ($code -eq 0) -or (Test-Path $lic)
          if (-not $activated) {
            # フォールバック: 認証済み .ulf を ProgramData へ直接置いて再確認する。
            # (内容はログに出さない)
            if ($hasUlf -and (Test-Path $ulf)) {
              Write-Output "manual activation failed (exit $code); falling back to copying .ulf to ProgramData"
              Copy-Item -Force -Path $ulf -Destination $lic
            }
          }
          if (-not (Test-Path $lic)) {
            throw "Unity ライセンス認証に失敗しました (exit $code)。ライセンスファイルが作成されませんでした ($lic)"
          }
          Write-Output "license file present: True"

      - name: EditMode テスト
        if: ${{ inputs.run_tests != 'false' }}
        shell: pwsh
        run: |
          $results = "$env:RUNNER_TEMP\TestResults.xml"
          # -quit を付けるとテストランナーが起動する前に Editor が終了する (仕様)。
          & $env:UNITY_EDITOR -batchmode -projectPath "$env:GITHUB_WORKSPACE" `
              -runTests -testPlatform editmode -testResults $results -logFile "$env:RUNNER_TEMP\test.log"
          if (-not (Test-Path $results)) {
            if (Test-Path "$env:RUNNER_TEMP\test.log") { Get-Content "$env:RUNNER_TEMP\test.log" -Tail 100 }
            throw "TestResults.xml が生成されていません (テストが実行されていない可能性が高い)"
          }
          [xml]$xml = Get-Content $results
          $total = $xml."test-run".total; $passed = $xml."test-run".passed; $failed = $xml."test-run".failed
          Write-Output "tests total=$total passed=$passed failed=$failed"
          $xml."test-run"."test-suite"."test-case" | Where-Object { $_.result -ne "Passed" } |
            ForEach-Object { Write-Output "FAIL $($_.fullname)" }
          "## EditMode テスト`n`ntotal=$total passed=$passed failed=$failed`n" >> $env:GITHUB_STEP_SUMMARY
          if ([int]$failed -gt 0) { throw "EditMode テストが $failed 件失敗しました" }

      - name: テスト結果と Unity ログを保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flashbeat-editmode-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/TestResults.xml
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/activate.log
          if-no-files-found: warn
          retention-days: 14

      - name: Win64 ビルド
        shell: pwsh
        env:
          FLASHBEAT_VERSION_BASE: ${{ inputs.version_base || '0.1.0' }}
          FLASHBEAT_UPDATE_CHANNEL: ${{ inputs.update_channel || 'preview' }}
        run: |
          $log = "$env:RUNNER_TEMP\build.log"
          & $env:UNITY_EDITOR -batchmode -nographics -quit `
              -projectPath "$env:GITHUB_WORKSPACE" `
              -executeMethod BuildScript.BuildStandaloneWindows64 `
              -logFile $log
          $buildExit = $LASTEXITCODE
          if (Test-Path $log) { Get-Content $log -Tail 200 }
          if ($buildExit -ne 0) { throw "Unity build failed (exit $buildExit)" }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\Builds\Windows\FlashBeat.exe")) {
            throw "ビルド成果物がありません (Builds\Windows\FlashBeat.exe)"
          }

      - name: パッケージ (ZIP + SHA-256)
        shell: pwsh
        run: |
          $sha = (git rev-parse --short HEAD).Trim()
          $full = (git rev-parse HEAD).Trim()
          $base = "${{ inputs.version_base }}"
          if (-not $base) { $base = "0.1.0" }
          $out = "$env:RUNNER_TEMP\dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools\release\package-win64.ps1 `
              -SourceDir "$env:GITHUB_WORKSPACE\Builds\Windows" `
              -OutDir $out `
              -Version "$base-win64-$sha" `
              -CommitSha $full `
              -MediaPolicy song-free
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed (exit $LASTEXITCODE)" }
          $zips = @(Get-ChildItem $out -Filter *.zip -File)
          if ($zips.Count -ne 1 -or $zips[0].Length -eq 0) { throw "Expected one nonempty Win64 ZIP" }
          $checksum = "$($zips[0].FullName).sha256"
          if (-not (Test-Path $checksum)) { throw "ZIP SHA-256 file is missing" }
          $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $zips[0].FullName -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "ZIP SHA-256 mismatch" }
          Get-ChildItem $out | Select-Object Name, Length
          "## Win64 ビルド成果物`n`n- 対象 SHA: $full`n- バージョン: $base-win64-$sha`n- 更新チャンネル: $env:FLASHBEAT_UPDATE_CHANNEL`n- SHA-256: $actual" >> $env:GITHUB_STEP_SUMMARY

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: flashbeat-win64-${{ github.sha }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30
